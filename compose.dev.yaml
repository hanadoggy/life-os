services:
  db:
    image: postgres:18-alpine
    container_name: lifeos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_dev}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lifeos} -d $${POSTGRES_DB:-lifeos_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:

